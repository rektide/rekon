[package]
name = "rekon"
version = "0.1.0"
edition = "2024"
description = "Rekon super-tool: rust-first subcommands, starting with the AGENTS.md combiner"
license = "MIT"

[workspace]
members = ["crates/*"]
resolver = "3"

[dependencies]
clap = { version = "4", features = ["derive"] }
markdown = "1"
pulldown-cmark = { version = "0.13.4", default-features = false }
rekon-markup = { path = "crates/rekon-markup" }
rekon-toc = { path = "crates/rekon-toc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.11.0"
tempfile = "3"
thiserror = "2"
