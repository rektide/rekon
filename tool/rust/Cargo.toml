[package]
name = "rekon"
version = "0.1.0"
edition = "2024"
description = "Rekon super-tool: rust-first subcommands, starting with the AGENTS.md combiner"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
